<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code</title>
<style>
:root {
  --bg: #ffffff; --panel: #f7f7f8; --border: #e4e4e7; --text: #18181b; --muted: #71717a;
  --accent: #18181b; --accent-text: #ffffff; --ok: #16a34a; --warn: #ca8a04; --bad: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b; --panel: #18181b; --border: #27272a; --text: #fafafa; --muted: #a1a1aa;
    --accent: #fafafa; --accent-text: #09090b; --ok: #22c55e; --warn: #eab308; --bad: #ef4444;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; display: grid; gap: 16px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 12px; }
section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
p { margin: 0 0 12px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; min-height: 34px; }
input { flex: 1 1 240px; min-width: 0; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
a { color: inherit; overflow-wrap: anywhere; }
.link { display: block; padding: 8px; margin: 0 0 12px; border: 1px dashed var(--border); border-radius: 6px; font-size: 12px; max-height: 96px; overflow: auto; }
.badge { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .bad .dot { background: var(--bad); }
pre { margin: 12px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
.msg { margin-top: 12px; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.tokens { display: grid; gap: 10px; margin-bottom: 12px; }
.token { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--bg); display: grid; gap: 8px; min-width: 0; }
.token.active { border-color: var(--ok); }
.token-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.token-name { font-weight: 600; overflow-wrap: anywhere; }
.token-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.meter { display: grid; grid-template-columns: minmax(84px, max-content) minmax(0, 1fr) max-content; gap: 4px 10px; align-items: center; font-size: 12px; }
.meter-label { color: var(--muted); }
.meter-error { grid-column: 1 / -1; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); }
.bar.warn > span { background: var(--warn); } .bar.bad > span { background: var(--bad); }
.meter-reset { grid-column: 2 / -1; color: var(--muted); font-size: 11px; margin-top: -2px; }
.empty { color: var(--muted); padding: 8px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content: space-between;"><h1 data-i18n="title"></h1><a href="/" data-i18n="back"></a></div>

  <section>
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <h2 style="margin: 0" data-i18n="status"></h2>
      <button id="refresh" data-i18n="refresh"></button>
    </div>
    <dl>
      <dt data-i18n="version"></dt><dd id="version">-</dd>
      <dt data-i18n="path"></dt><dd id="path">-</dd>
      <dt data-i18n="account"></dt><dd id="account">-</dd>
    </dl>
  </section>

  <section>
    <h2 data-i18n="proxy"></h2>
    <p data-i18n="proxyHint"></p>
    <form class="row" id="proxy-form">
      <input id="proxy-value" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit" data-i18n="save"></button>
      <button type="button" id="proxy-clear" data-i18n="clear"></button>
    </form>
    <p class="token-meta" style="margin: 8px 0 0;" id="proxy-env"></p>
    <div class="msg" id="proxy-msg" hidden></div>
  </section>

  <section>
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <h2 style="margin: 0" data-i18n="tokens"></h2>
      <button id="tokens-refresh" data-i18n="refreshUsage"></button>
    </div>
    <p data-i18n="tokensHint"></p>
    <div class="tokens" id="tokens"></div>
    <p id="tokens-fallback" hidden></p>
    <button id="tokens-deactivate" data-i18n="useAccount" hidden></button>
    <form class="row" id="token-form" style="margin-top: 12px;">
      <input id="token-name" autocomplete="off" maxlength="80" style="flex: 1 1 140px;">
      <input id="token-value" type="password" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit" data-i18n="tokenAdd"></button>
    </form>
    <p class="token-meta" style="margin: 8px 0 0;" data-i18n="tokenHowTo"></p>
    <div class="msg" id="tokens-msg" hidden></div>
  </section>

  <section id="login-section">
    <h2 data-i18n="login"></h2>
    <div id="login-idle">
      <p data-i18n="loginHint"></p>
      <div class="row">
        <select id="method" aria-label="method">
          <option value="claudeai" data-i18n="methodClaudeai"></option>
          <option value="console" data-i18n="methodConsole"></option>
        </select>
        <button class="primary" id="login-start" data-i18n="loginStart"></button>
        <button id="logout" data-i18n="logout" hidden></button>
      </div>
    </div>
    <div id="login-pending" hidden>
      <p data-i18n="loginStep1"></p>
      <a class="link" id="login-url" target="_blank" rel="noopener noreferrer"></a>
      <div class="row" style="margin-bottom: 12px;">
        <button id="open-url" data-i18n="openLink"></button>
        <button id="copy-url" data-i18n="copyLink"></button>
      </div>
      <p data-i18n="loginStep2"></p>
      <form class="row" id="code-form">
        <input id="code" autocomplete="off" spellcheck="false">
        <button class="primary" type="submit" id="code-submit" data-i18n="submit"></button>
        <button type="button" id="login-cancel" data-i18n="cancel"></button>
      </form>
    </div>
    <div class="msg" id="login-msg" hidden></div>
    <pre id="login-output" hidden></pre>
  </section>

  <section>
    <h2 data-i18n="update"></h2>
    <p data-i18n="updateHint"></p>
    <button class="primary" id="update" data-i18n="updateRun"></button>
    <div class="msg" id="update-msg" hidden></div>
    <pre id="update-output" hidden></pre>
  </section>

  <p data-i18n="afterHint"></p>
</main>

  },

    notInstalled: 'Not installed', signedOut: 'Signed out', signedIn: 'Signed in', loading: 'Loading…',

    proxy: 'Network proxy', proxyHint: 'Set this when Anthropic is only reachable through a proxy. The Claude CLI and usage checks share it; it is saved in Claude's settings.json and applies to tasks started afterwards.', save: 'Save', clear: 'Clear',
    proxyPlaceholder: 'For example http://192.168.1.10:7890', proxyEnv: 'Container proxy variable: {value} (used when none is set here)', proxyNone: 'The container sets no proxy variable.', proxySaved: 'Proxy saved.', proxyCleared: 'Cleared; the container proxy variable is used.',
    err_invalid_proxy: 'Invalid proxy address. Use an http://, https:// or socks5:// URL.', err_settings_unreadable: 'Claude's settings.json cannot be parsed and was left unchanged.', err_settings_write_failed: 'Could not save.',
  },
}
const lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'
const t = (key, vars = {}) => (messages[lang][key] || key).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? '')
document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n) })
const $ = (id) => document.getElementById(id)
$('code').placeholder = t('codePlaceholder')

async function api(path, body, method = 'POST') {
  let res
  try {
    res = await fetch(path, body === undefined ? { cache: 'no-store' } : {
      method, headers: { 'Content-Type': 'application/json', 'X-Denova-Claude': '1' }, body: JSON.stringify(body),
    })
  } catch { throw new Error(t('err_network')) }
  if (res.status === 401) { location.href = '/'; throw new Error(t('err_unauthorized')) }
  if (res.status === 204) return {}
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(messages[lang]['err_' + data.error] || t('err_unknown'))
  return data
}

function show(id, text, tone) {
  const el = $(id)
  el.hidden = !text
  el.textContent = text || ''
  if (tone !== undefined) el.className = 'msg ' + tone
}

function setBusy(busy) {
  document.querySelectorAll('button, select, input').forEach((el) => { el.disabled = busy })
}

async function run(action) {
  setBusy(true)
  try { await action() } finally { setBusy(false) }
}

function badge(text, tone) {
  const span = document.createElement('span')
  span.className = 'badge ' + tone
  const dot = document.createElement('span')
  dot.className = 'dot'
  span.append(dot, document.createTextNode(text))
  return span
}

async function refresh() {
  $('account').textContent = t('loading')
  let status
  try { status = await api('api/status') } catch (error) { $('account').textContent = error.message; return }
  $('version').textContent = status.version || '-'
  $('path').textContent = status.path || '-'
  const account = $('account')
  account.replaceChildren()
  if (!status.installed) account.append(badge(t('notInstalled'), 'bad'))
  else if (status.auth?.loggedIn) {
    const detail = [status.auth.email, status.auth.orgName, status.auth.subscriptionType || status.auth.authMethod].filter(Boolean).join(' · ')
    account.append(badge(t('signedIn') + (detail ? ' · ' + detail : ''), 'ok'))
  } else account.append(badge(t('signedOut'), 'warn'))
  $('logout').hidden = !status.auth?.loggedIn
  setPending(status.login_pending ? status.login_url : '')
}

function setPending(url) {
  $('login-idle').hidden = !!url
  $('login-pending').hidden = !url
  $('login-url').href = url || '#'
  $('login-url').textContent = url || ''
  if (url) $('code').value = ''
}

$('refresh').onclick = () => run(refresh)

$('token-name').placeholder = t('tokenNamePlaceholder')
$('token-value').placeholder = t('tokenValuePlaceholder')
const timeFormat = new Intl.DateTimeFormat(document.documentElement.lang, { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' })
const formatTime = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? '' : timeFormat.format(date) }

function element(tag, className, text) {
  const el = document.createElement(tag)
  if (className) el.className = className
  if (text !== undefined) el.textContent = text
  return el
}

function usageMeters(usage) {
  const box = element('div', 'meter')
  if (!usage || usage.error) {
    box.append(element('span', 'meter-label meter-error', usage?.error_key === 'rejected' ? `${t('usageRejected')} (${usage.error})` : t('usageFailed', { error: usage?.error || '-' })))
    return box
  }
  for (const window of usage.windows || []) {
    const percent = Math.max(0, Math.min(100, Math.round(window.utilization)))
    const bar = element('div', 'bar' + (percent >= 90 ? ' bad' : percent >= 70 ? ' warn' : ''))
    const fill = element('span')
    fill.style.width = percent + '%'
    bar.append(fill)
    bar.setAttribute('role', 'meter'); bar.setAttribute('aria-valuenow', String(percent)); bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', '100')
    box.append(element('span', 'meter-label', t('window_' + window.kind, { label: window.label || '' })), bar, element('span', '', t('used', { p: percent })))
    const reset = formatTime(window.resets_at)
    if (reset) box.append(element('span', 'meter-reset', t('resetsAt', { time: reset })))
  }
  return box
}

async function loadTokens(force = false) {
  let data
  try { data = await api('api/tokens' + (force ? '?refresh=1' : '')) } catch (error) { show('tokens-msg', error.message, 'bad'); return }
  const list = $('tokens')
  list.replaceChildren()
  if (!data.tokens.length) list.append(element('div', 'empty', t('tokensEmpty')))
  for (const token of data.tokens) {
    const card = element('div', 'token' + (token.active ? ' active' : ''))
    const head = element('div', 'token-head')
    const title = element('div')
    title.append(element('div', 'token-name', token.name), element('div', 'token-meta', token.masked))
    const actions = element('div', 'row')
    if (token.active) actions.append(badge(t('tokenActive'), 'ok'))
    else {
      const use = element('button', 'primary', t('tokenUse'))
      use.onclick = () => run(async () => {
        try { await api('api/tokens/active', { id: token.id }); show('tokens-msg', t('tokenSwitched'), 'ok') } catch (error) { show('tokens-msg', error.message, 'bad') }
        await Promise.all([loadTokens(), refresh()])
      })
      actions.append(use)
    }
    const remove = element('button', '', t('tokenDelete'))
    remove.onclick = () => {
      if (!confirm(t('tokenDeleteConfirm', { name: token.name }))) return
      run(async () => {
        try { await api('api/tokens/' + encodeURIComponent(token.id), {}, 'DELETE') } catch (error) { show('tokens-msg', error.message, 'bad') }
        await Promise.all([loadTokens(), refresh()])
      })
    }
    actions.append(remove)
    head.append(title, actions)
    const checked = token.usage?.checked_at ? t('checkedAt', { time: formatTime(token.usage.checked_at) }) + (token.usage.source === 'probe' ? t('usageProbe') : '') : ''
    card.append(head, usageMeters(token.usage), element('div', 'token-meta', checked))
    list.append(card)
  }
  const fallback = $('tokens-fallback')
  fallback.hidden = !!data.active
  fallback.textContent = data.env_token ? t('fallbackEnv') : t('fallbackAccount')
  $('tokens-deactivate').hidden = !data.active
}

$('proxy-value').placeholder = t('proxyPlaceholder')
async function loadProxy() {
  try {
    const data = await api('api/proxy')
    $('proxy-value').value = data.proxy || ''
    $('proxy-env').textContent = data.environment ? t('proxyEnv', { value: data.environment }) : t('proxyNone')
  } catch (error) { show('proxy-msg', error.message, 'bad') }
}
async function saveProxy(value) {
  try {
    await api('api/proxy', { proxy: value }, 'PUT')
    show('proxy-msg', t(value ? 'proxySaved' : 'proxyCleared'), 'ok')
  } catch (error) { show('proxy-msg', error.message, 'bad'); return }
  await Promise.all([loadProxy(), loadTokens(true)])
}
$('proxy-form').onsubmit = (event) => { event.preventDefault(); run(() => saveProxy($('proxy-value').value.trim())) }
$('proxy-clear').onclick = () => run(() => saveProxy(''))

$('tokens-refresh').onclick = () => run(() => loadTokens(true))
$('tokens-deactivate').onclick = () => run(async () => {
  try { await api('api/tokens/active', { id: '' }); show('tokens-msg', t('tokenSwitched'), 'ok') } catch (error) { show('tokens-msg', error.message, 'bad') }
  await Promise.all([loadTokens(), refresh()])
})
$('token-form').onsubmit = (event) => {
  event.preventDefault()
  const token = $('token-value').value.trim()
  if (!token) return
  run(async () => {
    try {
      await api('api/tokens', { name: $('token-name').value.trim(), token })
      $('token-name').value = ''; $('token-value').value = ''
      show('tokens-msg', t('tokenAdded'), 'ok')
    } catch (error) { show('tokens-msg', error.message, 'bad') }
    await Promise.all([loadTokens(), refresh()])
  })
}

$('login-start').onclick = () => run(async () => {
  show('login-msg', ''); show('login-output', '')
  try {
    const { url } = await api('api/login/start', { method: $('method').value })
    setPending(url)
    $('code').focus()
  } catch (error) { show('login-msg', error.message, 'bad') }
})

$('open-url').onclick = () => window.open($('login-url').href, '_blank', 'noopener')
$('copy-url').onclick = async () => {
  try { await navigator.clipboard.writeText($('login-url').href); $('copy-url').textContent = t('copied') } catch {
    const range = document.createRange(); range.selectNodeContents($('login-url'))
    getSelection().removeAllRanges(); getSelection().addRange(range)
  }
  setTimeout(() => { $('copy-url').textContent = t('copyLink') }, 1500)
}

$('code-form').onsubmit = (event) => {
  event.preventDefault()
  const code = $('code').value.trim()
  if (!code) return
  run(async () => {
    try {
      const result = await api('api/login/code', { code })
      show('login-msg', t(result.ok ? 'loginOk' : 'loginFailed'), result.ok ? 'ok' : 'bad')
      if (!result.ok) show('login-output', result.output)
    } catch (error) { show('login-msg', error.message, 'bad') }
    await refresh()
  })
}

$('login-cancel').onclick = () => run(async () => {
  try { await api('api/login/cancel', {}) } catch (error) { show('login-msg', error.message, 'bad') }
  await refresh()
})

$('logout').onclick = () => run(async () => {
  show('login-output', '')
  try {
    const result = await api('api/logout', {})
    show('login-msg', t(result.ok ? 'logoutOk' : 'logoutFailed'), result.ok ? 'ok' : 'bad')
    if (!result.ok) show('login-output', result.output)
  } catch (error) { show('login-msg', error.message, 'bad') }
  await refresh()
})

$('update').onclick = () => run(async () => {
  show('update-msg', t('updating'), ''); show('update-output', '')
  try {
    const result = await api('api/update', {})
    show('update-msg', result.ok ? t('updateOk', { v: result.version || '-' }) : t('updateFailed'), result.ok ? 'ok' : 'bad')
    show('update-output', result.output)
  } catch (error) { show('update-msg', error.message, 'bad') }
  await refresh()
})

run(() => Promise.all([refresh(), loadTokens(), loadProxy()]))
</script>
</body>
</html>
