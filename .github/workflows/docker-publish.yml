name: Docker

# Publishes a container image for every upstream release. GitHub cannot notify
# a fork about upstream releases, so a schedule polls the latest release and
# builds only tags that have no image yet. The image is built from the upstream
# release sources plus this repository's container files, so fork-only changes
# never leak into a release image.
#
# A push to master also publishes the `fork` tag from this repository's source,
# and republishes the current release only when container files changed. Both
# targets build in parallel with separate layer caches.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag, for example v0.5.0 (default: latest upstream release)'
        required: false
        type: string
      force:
        description: 'Rebuild even if the image tag already exists'
        required: false
        type: boolean
        default: false
      fork:
        description: 'Build this repository''s selected branch source instead of an upstream release; publishes the fork tag and never moves latest'
        required: false
        type: boolean
        default: false
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'alfredxw/denova' }}

jobs:
  resolve:
    name: Resolve build targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force == true }}
          FORK_BUILD: ${{ inputs.fork == true }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/denova"
          targets='[]'
          add() { # tag version latest source_repository source_ref cache
            targets=$(jq -c --arg tag "$1" --arg version "$2" --argjson latest "$3" --arg repo "$4" --arg ref "$5" --arg cache "$6" --arg image "$image" \
              '. + [{tag: $tag, version: $version, latest: $latest, source_repository: $repo, source_ref: $ref, cache: $cache, image: $image}]' <<<"$targets")
          }
          # Fork builds carry unreleased fixes; they get their own tag only.
          # The build job appends the last application commit to the version.
          add_fork() { add fork "${latest#v}-fork" false "$GITHUB_REPOSITORY" "$GITHUB_SHA" fork; }
          add_release() { # tag force
            local tag=$1
            if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            gh api "repos/$UPSTREAM_REPOSITORY/releases/tags/$tag" --jq .tag_name >/dev/null
            if [[ "$2" != true ]] && docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo "Image $image:$tag already exists; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            add "$tag" "${tag#v}" "$([[ "$tag" == "$latest" ]] && echo true || echo false)" "$UPSTREAM_REPOSITORY" "$tag" release
          }
          if [[ "$EVENT" == push ]]; then
            add_fork
            # Release images take only container files from this repository.
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo Dockerfile)
            if grep -qE '^(Dockerfile|\.dockerignore|compose\.yaml|docker/|\.github/workflows/docker-publish\.yml)' <<<"$changed"; then
              add_release "$latest" true
            fi
          elif [[ "$FORK_BUILD" == true ]]; then
            add_fork
          else
            add_release "${INPUT_TAG:-$latest}" "$FORCE"
          fi
          echo "Targets: $targets" >> "$GITHUB_STEP_SUMMARY"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.tag }}
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    env:
      ARCH: amd64
      TAG: ${{ matrix.target.tag }}
      LATEST: ${{ matrix.target.latest }}
      IMAGE: ${{ matrix.target.image }}
      DENOVA_IMAGE: ${{ matrix.target.image }}
      IMAGE_TAG: ${{ matrix.target.tag }}-amd64
      # Release binaries report the tag without its leading v. The build step
      # exports the final VERSION.
      BASE_VERSION: ${{ matrix.target.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: overlay
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.target.source_repository }}
          ref: ${{ matrix.target.source_ref }}
          path: src
          # Fork versions name the last application commit, which needs history.
          # A string '0': the number 0 is falsy and would always yield 1.
          fetch-depth: ${{ matrix.target.cache == 'fork' && '0' || '1' }}
      - name: Check Claude page script syntax
        run: |
          set -euo pipefail
          node -e "const s = require('fs').readFileSync('overlay/docker/claude-page/index.html', 'utf8'); require('fs').writeFileSync('/tmp/claude-page.js', s.slice(s.indexOf('<script>') + 8, s.lastIndexOf('</script>')))"
          node --check /tmp/claude-page.js
      - name: Apply container files and read toolchain versions
        id: versions
        run: |
          set -euo pipefail
          cp -r overlay/Dockerfile overlay/.dockerignore overlay/compose.yaml overlay/docker src/
          version=$BASE_VERSION
          if [[ "${{ matrix.target.cache }}" == fork ]]; then
            # Container file and docs commits keep the version, and with it the
            # cached application build, unchanged.
            app=$(git -C src log -1 --format=%h --abbrev=7 -- . ':!docker' ':!Dockerfile' ':!compose.yaml' ':!.dockerignore' ':!.github' ':!docs' ':!*.md')
            version="$BASE_VERSION.$app"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          go_version=$(awk '/^toolchain go/ {sub(/^go/, "", $2); print $2; exit}' src/go.mod)
          go_version=${go_version:-$(awk '/^go / {print $2; exit}' src/go.mod)}
          pnpm_version=$(jq -r '.packageManager // "pnpm@11.15.1"' src/web/package.json | sed 's/^pnpm@//; s/+.*//')
          node_version=$(grep -oP "node-version:\s*['\"]?\K[0-9.]+" src/.github/actions/setup-web/action.yml 2>/dev/null || echo 22)
          {
            echo "go=$go_version"
            echo "pnpm=$pnpm_version"
            echo "node=$node_version"
            echo "claude=$(npm view @anthropic-ai/claude-code version)"
            echo "revision=$(git -C src rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete application
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            DENOVA_VERSION=${{ env.VERSION }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.versions.outputs.revision }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
          # Release and fork sources differ; a shared scope would evict each other.
          cache-from: type=gha,scope=denova-${{ matrix.target.cache }}-amd64
          cache-to: type=gha,scope=denova-${{ matrix.target.cache }}-amd64,mode=max
      - name: Verify startup, authentication and persistence
        working-directory: src
        run: |
          set -euo pipefail
          umask 077
          export DENOVA_USERNAME=admin DENOVA_PASSWORD="$(openssl rand -hex 24)"
          printf 'DENOVA_USERNAME=%s\nDENOVA_PASSWORD=%s\nWEB_PORT=8082\n' "$DENOVA_USERNAME" "$DENOVA_PASSWORD" > .env
          docker compose up -d --wait --wait-timeout 240
          curl -fsS http://localhost:8082/ > /tmp/home.html
          grep -q '<html' /tmp/home.html
          curl -fsS http://localhost:8082/api/auth/status | jq -e '.local == false and .authenticated == false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8082/api/agent-chat/projects)" = 401
          jq -n '{username:env.DENOVA_USERNAME,password:env.DENOVA_PASSWORD}' > /tmp/login.json
          curl -fsS -c /tmp/cookies -H 'Content-Type: application/json' --data-binary @/tmp/login.json http://localhost:8082/api/auth/login | jq -e '.authenticated == true'
          curl -fsS -b /tmp/cookies http://localhost:8082/api/agent-chat/projects > /dev/null
          test "$(docker compose exec -T denova denova --version | tr -d '\r')" = "$VERSION"
          docker compose exec -T denova rg --version
          docker compose exec -T denova chromium --version
          docker compose exec -T denova claude --version
          docker compose exec -T denova sh -c 'claude auth status || true' | jq -e '.loggedIn == false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 127.0.0.1' http://localhost:8082/api/agent-chat/projects)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8082/claude/)" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 127.0.0.1' http://localhost:8082/claude/api/status)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/cookies -X POST http://localhost:8082/claude/api/logout)" = 403
          curl -fsS -b /tmp/cookies http://localhost:8082/claude/ | grep -q '<html'
          curl -fsS -b /tmp/cookies http://localhost:8082/claude/api/status | jq -e '.installed == true and .auth.loggedIn == false and (.version | length > 0)'
          curl -fsS -b /tmp/cookies -H 'X-Denova-Claude: 1' -H 'Content-Type: application/json' -d '{"method":"claudeai"}' http://localhost:8082/claude/api/login/start | jq -e '.url | startswith("https://")'
          curl -fsS -b /tmp/cookies -H 'X-Denova-Claude: 1' -X POST http://localhost:8082/claude/api/login/cancel
          test "$(docker compose exec -T denova sh -c 'command -v claude')" = /opt/denova/launcher/claude
          curl -fsS -b /tmp/cookies http://localhost:8082/claude/api/tokens | jq -e '.tokens == [] and .active == ""'
          curl -fsS -b /tmp/cookies -H 'X-Denova-Claude: 1' -H 'Content-Type: application/json' -d '{"name":"smoke","token":"sk-ant-oat01-smoke-invalid-token"}' http://localhost:8082/claude/api/tokens | jq -e '.id | length > 0'
          docker compose exec -T denova sh -c 'test "$(stat -c %a /data/.config/denova-claude/active-token)" = 600 && grep -q smoke-invalid /data/.config/denova-claude/active-token'
          curl -fsS -b /tmp/cookies http://localhost:8082/claude/api/tokens | jq -e '.tokens[0].active == true and .tokens[0].usage.error_key == "rejected"'
          id=$(curl -fsS -b /tmp/cookies http://localhost:8082/claude/api/tokens | jq -r '.tokens[0].id')
          curl -fsS -b /tmp/cookies -H 'X-Denova-Claude: 1' -X DELETE "http://localhost:8082/claude/api/tokens/$id"
          docker compose exec -T denova sh -c 'test ! -s /data/.config/denova-claude/active-token'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/cookies -H 'X-Denova-Claude: 1' -H 'Content-Type: application/json' -X PUT -d '{"proxy":"127.0.0.1:7890"}' http://localhost:8082/claude/api/proxy)" = 400
          curl -fsS -b /tmp/cookies -H 'X-Denova-Claude: 1' -H 'Content-Type: application/json' -X PUT -d '{"proxy":"http://proxy.invalid:3128"}' http://localhost:8082/claude/api/proxy
          docker compose exec -T denova sh -c 'grep -q "\"HTTPS_PROXY\": \"http://proxy.invalid:3128\"" /data/.claude/settings.json'
          curl -fsS -b /tmp/cookies http://localhost:8082/claude/api/proxy | jq -e '.proxy == "http://proxy.invalid:3128"'
          curl -fsS -b /tmp/cookies -H 'X-Denova-Claude: 1' -H 'Content-Type: application/json' -X PUT -d '{"proxy":""}' http://localhost:8082/claude/api/proxy
          docker compose exec -T denova sh -c '! grep -q PROXY /data/.claude/settings.json'
          docker compose exec -T denova sh -c 'test -x /opt/denova/denova-updater && test -d /opt/denova/skills && test -f /opt/denova/web/index.html'
          docker compose exec -T denova sh -c 'printf persisted > /data/.denova/container-smoke'
          docker compose exec -T denova sha256sum /data/.denova/config.toml > /tmp/config-before
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          test "$(docker compose exec -T denova cat /data/.denova/container-smoke)" = persisted
          docker compose exec -T denova sha256sum /data/.denova/config.toml > /tmp/config-after
          cmp /tmp/config-before /tmp/config-after
          curl -fsS -b /tmp/cookies http://localhost:8082/api/auth/status | jq -e '.authenticated == true'
          curl -fsS -b /tmp/cookies http://localhost:8082/api/agent-chat/projects > /dev/null
      - name: Publish tested image and tags
        run: |
          set -euo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          tags=(-t "$IMAGE:$TAG")
          # Only the newest upstream release moves latest; manual rebuilds of
          # older tags must not roll existing deployments back.
          if [[ "$LATEST" == true ]]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$IMAGE_TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw | tee /tmp/manifest.json
          jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64"]' /tmp/manifest.json
          echo "Published $IMAGE:$TAG (latest=$LATEST)" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostic logs
        if: failure()
        working-directory: src
        run: if [ -f .env ]; then docker compose logs --tail=100; fi
      - name: Clean up runtime check
        if: always()
        working-directory: src
        run: if [ -f .env ]; then docker compose down -v; fi
